server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Dashboard công khai có khối HTML do quản trị viên biên soạn. Nội dung khối
  # được làm sạch và chạy trong iframe sandbox; các header dưới đây là lớp bảo vệ
  # bổ sung để không cho script/plugin/biểu mẫu ngoài hệ thống hoạt động.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tối đa 5 minh chứng, mỗi tệp 10 MB, cộng phần bao multipart.
    client_max_body_size 55m;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
