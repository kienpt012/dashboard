<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <meta name="description" content="IOC — Trung tâm điều hành" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <title>IOC · Trung tâm điều hành</title>
    <script>
      // Đặt nền tối/sáng trước khi React vẽ để không chớp trắng.
      (function () {
        try {
          var choice = localStorage.getItem('ioc_theme');
          var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.style.background = dark ? '#141414' : '#f5f6f8';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
