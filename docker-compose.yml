services:
  postgres:
    # PostgreSQL 17 Alpine + pgvector (B13–B14). Image dựng một lần từ deploy/postgres/Dockerfile, cùng nền với
    # postgres:17-alpine cũ nên dùng tiếp volume dữ liệu hiện có.
    image: ${IOC_INSTANCE:-ioc-laithieu}-db:pg17-pgvector-0.8.7
    build:
      context: deploy/postgres
    container_name: ${IOC_INSTANCE:-ioc-laithieu}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ioc_laithieu}
      POSTGRES_USER: ${POSTGRES_USER:-ioc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ioc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ioc_admin} -d ${POSTGRES_DB:-ioc_laithieu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: "${IOC_INSTANCE:-ioc-laithieu}-api:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${IOC_INSTANCE:-ioc-laithieu}-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POSTGRES_DB: ${POSTGRES_DB:-ioc_laithieu}
      POSTGRES_USER: ${POSTGRES_USER:-ioc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in .env}
      PASSWORD_RESET_PEPPER: ${PASSWORD_RESET_PEPPER:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      PUBLIC_DASHBOARD_ALLOWED_LINK_HOSTS: ${PUBLIC_DASHBOARD_ALLOWED_LINK_HOSTS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_OUTBOX_POLL_MS: ${MAIL_OUTBOX_POLL_MS:-5000}
      MAIL_OUTBOX_BATCH_SIZE: ${MAIL_OUTBOX_BATCH_SIZE:-10}
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-8}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      RUN_DEMO_SEED: ${RUN_DEMO_SEED:-false}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@12345}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo@12345}
      PORT: 3000
      # Lớp AI cục bộ: mặc định dùng Ollama chạy trên máy host (Docker Desktop).
      # Khi Ollama tắt, hệ thống tự hạ cấp về trích xuất bằng luật, không lỗi.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EXTRACT_MODEL: ${OLLAMA_EXTRACT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-480000}
      OLLAMA_HEALTH_TIMEOUT_MS: ${OLLAMA_HEALTH_TIMEOUT_MS:-10000}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-}
      TESSERACT_LANGS: ${TESSERACT_LANGS:-vie+eng}
      EXTRACTION_POLL_MS: ${EXTRACTION_POLL_MS:-4000}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
      # 0 = không giới hạn số trang OCR của bộ đọc dự phòng (bản cũ dừng ở 20 trang và để trống các trang sau).
      EXTRACTION_MAX_OCR_PAGES: ${EXTRACTION_MAX_OCR_PAGES:-0}
      EXTRACTION_MAX_LLM_CHUNKS: ${EXTRACTION_MAX_LLM_CHUNKS:-40}
      DISABLE_EXTRACTION_WORKER: ${DISABLE_EXTRACTION_WORKER:-false}
      # Quy trình xử lý văn bản bản 2: ocr-service (Docling + VietOCR) đọc B2–B6. Để trống thì dùng bộ đọc dự phòng
      # (pdf.js + Tesseract). Bật bằng COMPOSE_PROFILES=ocr và OCR_SERVICE_URL=http://ocr:8000 trong .env.
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-}
      OCR_SERVICE_PAGE_BATCH: ${OCR_SERVICE_PAGE_BATCH:-4}
      OCR_SERVICE_TIMEOUT_MS: ${OCR_SERVICE_TIMEOUT_MS:-900000}
      CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-1400}
      CHUNK_TABLE_FORMAT: ${CHUNK_TABLE_FORMAT:-plain}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      MATCH_DUPLICATE_THRESHOLD: ${MATCH_DUPLICATE_THRESHOLD:-0.95}
      MATCH_NEAR_THRESHOLD: ${MATCH_NEAR_THRESHOLD:-0.85}
    networks:
      - default
      - ocr_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: "${IOC_INSTANCE:-ioc-laithieu}-web:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ${IOC_INSTANCE:-ioc-laithieu}-web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  ocr:
    # B2–B6: Docling (bố cục, bảng, cấu trúc), RapidOCR (tìm dòng), VietOCR (đọc chữ), OpenCV (chuẩn bị ảnh).
    # Chỉ nằm trong mạng nội bộ, không mở cổng ra máy và không ra được Internet.
    profiles: ["ocr"]
    image: "${IOC_INSTANCE:-ioc-laithieu}-ocr:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
    container_name: ${IOC_INSTANCE:-ioc-laithieu}-ocr
    restart: unless-stopped
    environment:
      OCR_DPI: ${OCR_DPI:-216}
      OCR_SECOND_READER: ${OCR_SECOND_READER:-rapidocr}
      OCR_THREADS: ${OCR_THREADS:-4}
      OCR_TABLE_MODE: ${OCR_TABLE_MODE:-accurate}
    networks:
      - ocr_internal

networks:
  ocr_internal:
    internal: true

volumes:
  ioc_postgres_data:
